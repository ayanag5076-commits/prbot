# Copy to .github/workflows/prbot-review.yml in any Python repo with a pytest suite,
# then add an OPENAI_API_KEY repository secret (Settings -> Secrets and variables -> Actions).
name: prbot review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  prbot:
    runs-on: ubuntu-latest
    steps:
      - uses: ayanag5076-commits/prbot@main
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # open-fix-pr: "true"   # also needs  contents: write
