[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prbot"
version = "0.1.0"
description = "Autonomous PR review and code-patching agent: LangGraph reviewer, ReAct patcher, Docker test runner with a self-correction loop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ayana Greer" }]
dependencies = [
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.2",
  "pydantic>=2.6",
  "PyGithub>=2.3",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prbot = "prbot.cli:main"

[tool.setuptools.packages.find]
include = ["prbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
